name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: walking-alerts-frontend
        run: npm install

      - name: Build frontend
        working-directory: walking-alerts-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: walking-alerts-frontend/dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Configure GitHub Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          set -e
          echo 'Checking GitHub Pages config...'
          # Try first with the repo PAT (PAGES_TOKEN), fallback to GITHUB_TOKEN
          token_to_use="$PAGES_TOKEN"
          if [ -z "$token_to_use" ] || [ "$token_to_use" = "null" ]; then
            token_to_use="$GITHUB_TOKEN"
          fi
          response=$(curl -s -H "Authorization: token $token_to_use" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/pages)
          echo "Current Pages API response:"
          echo "$response"
          current_branch=$(python - <<'PY'
import json,sys
try:
    doc=json.load(sys.stdin)
    print(doc.get('source', {}).get('branch', ''))
except Exception:
    sys.exit(0)
PY
<<<"$response")
          current_path=$(python - <<'PY'
import json,sys
try:
    doc=json.load(sys.stdin)
    print(doc.get('source', {}).get('path', ''))
except Exception:
    sys.exit(0)
PY
<<<"$response")
          echo "Current Pages source: branch=$current_branch path=$current_path"
          if [ "$current_branch" != "gh-pages" ] || [ "$current_path" != "/" ]; then
            echo 'Updating GitHub Pages source to gh-pages branch...'
            response=$(curl -s -w '\n%{http_code}' -X PUT \
              -H "Authorization: token $token_to_use" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "$response"
          else
            echo 'GitHub Pages already set to gh-pages /'
          fi
