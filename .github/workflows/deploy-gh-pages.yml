name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: walking-alerts-frontend
        run: npm install

      - name: Build frontend
        working-directory: walking-alerts-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: walking-alerts-frontend/dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Configure GitHub Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo 'Checking GitHub Pages config...'
          status_code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/pages)
          echo "Current Pages status code: $status_code"
          if [ "$status_code" -eq 404 ]; then
            echo 'Creating GitHub Pages site from gh-pages branch...'
            response=$(curl -s -w '\n%{http_code}' -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "$response"
          else
            echo "GitHub Pages already configured or accessible (HTTP $status_code)"
            cat /tmp/pages.json
          fi
